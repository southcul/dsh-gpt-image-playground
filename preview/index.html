<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gpt-image-playground shell harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f5f2;
        color: #1f2328;
        font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #shell {
        display: grid;
        grid-template-columns: 220px 1fr;
        height: 100%;
      }
      #rail {
        border-right: 1px solid color-mix(in srgb, currentColor 14%, transparent);
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      #rail button {
        font: inherit;
        color: inherit;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        padding: 7px 9px;
        cursor: pointer;
      }
      #rail button[data-active='true'] {
        background: color-mix(in srgb, currentColor 9%, transparent);
        border-color: color-mix(in srgb, currentColor 16%, transparent);
      }
      .main {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .banner {
        padding: 8px 12px;
        font-size: 12px;
        opacity: 0.7;
        border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent);
      }
      .stage {
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="shell"></div>
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script>
      window.__slots = {}
      window.__ModuleLoader__ = {
        load({ id, factory }) {
          window.__plugin = factory((specifier) => {
            if (specifier === 'react') return window.React
            throw new Error('unexpected require: ' + specifier)
          })
          window.__plugin.__id = id
        },
      }
    </script>
    <script src="/client.js"></script>
    <script>
      const plugin = window.__plugin
      plugin.apply({
        effect: (fn) => fn(),
        slots: {
          inject: (_name, callback) => callback(),
          register: (spec, Component) => {
            window.__slots[spec.name + ':' + (spec.key || spec.id || '')] = Component
            return () => {}
          },
        },
      })

      const Workbench = window.__slots['main:gpt-image-playground']
      const Surface = window.__slots['shell.overlay:gpt-image-playground-surface']

      // Faithful mock of the DSH shell: `main` mounts only the selected entry,
      // `shell.overlay` entries stay mounted for the whole session.
      function Shell() {
        const [active, setActive] = React.useState('workbench')
        window.__selectPanel = setActive
        return React.createElement(
          React.Fragment,
          null,
          React.createElement(
            'div',
            { id: 'rail' },
            [['workbench', '生图工作台'], ['conversation', '会话']].map(([id, label]) =>
              React.createElement(
                'button',
                { key: id, 'data-panel': id, 'data-active': String(active === id), onClick: () => setActive(id) },
                label,
              ),
            ),
          ),
          React.createElement(
            'div',
            { className: 'main' },
            React.createElement('div', { className: 'banner' }, 'mock DSH shell · ', React.createElement('span', { id: 'active-label' }, active)),
            React.createElement(
              'div',
              { className: 'stage' },
              active === 'workbench'
                ? React.createElement(Workbench)
                : React.createElement('div', { id: 'conversation-page', style: { padding: 16, opacity: 0.6 } }, '会话页面（工作台已从 main 卸载）'),
            ),
            React.createElement(Surface),
          ),
        )
      }

      ReactDOM.createRoot(document.getElementById('shell')).render(React.createElement(Shell))
    </script>
  </body>
</html>
